name: Windows build and shortcut tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          foreach ($path in @('tools\Measure-CaptureStartup.ps1', 'tools\build-check.ps1', 'tools\Package-Release.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error "$path`: $($_.Message)" }; exit 1 }
          }
      - name: Build Release x64
        shell: pwsh
        run: |
          & .\tools\build-check.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test per-user keyboard shortcuts (isolated)
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\Test-Shortcuts.ps1 -Executable '.\bin\x64\Release\RBG - RScreenFlash.exe' -Namespace 'RScreenFlash' -ApplicationName 'RBG RScreenFlash'
